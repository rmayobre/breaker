name: Publish to pub.dev

# Publishes the package when a version tag is pushed, e.g. `v1.2.3`.
#
# One-time setup on pub.dev (package Admin tab -> Automated publishing):
#   1. Enable "Publishing from GitHub Actions".
#   2. Repository: rmayobre/breaker
#   3. Tag pattern: v{{version}}
# No secrets are needed; authentication uses GitHub's OIDC token.
#
# Release steps: bump `version` in pubspec.yaml, update CHANGELOG.md, merge to
# main, then `git tag v<version> && git push origin v<version>`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for pub.dev automated publishing via OIDC.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify tag matches pubspec version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "Tag ($tag_version) does not match pubspec.yaml version ($pubspec_version)."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate package
        run: flutter pub publish --dry-run

      # `pub publish` does not fetch the GitHub OIDC token by itself (the
      # official dart-lang/setup-dart action does this, but it installs Dart,
      # not Flutter). Exchange the token manually and register it with pub;
      # without it, pub falls back to an interactive browser login and hangs.
      - name: Authenticate with pub.dev
        run: |
          token="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            | jq -r '.value')"
          echo "::add-mask::${token}"
          echo "PUB_TOKEN=${token}" >> "$GITHUB_ENV"
          flutter pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Publish
        run: flutter pub publish --force
